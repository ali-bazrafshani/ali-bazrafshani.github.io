<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تایم‌لاین انیمیشنی</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #fff;
    direction: rtl;
  }

  .header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
  }

  .timeline-container {
    display: flex;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    gap: 20px;
    position: relative;
  }

  /* ستون دایره‌ها */
  .circles {
    flex: 0 0 20%;
    display: flex;
    flex-direction: column;
    gap: 30px;
    position: relative;
  }

  .circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    position: relative;
    z-index: 2;
  }

  .y1998 { background: #e53935; }
  .y2005 { background: #fb8c00; }
  .y2008 { background: #fdd835; color:#000; }
  .y2010 { background: #43a047; }
  .y2013 { background: #1e88e5; }
  .y2017 { background: #d81b60; }

  /* بلوک سیاه یکپارچه */
  .black-box {
    flex: 1;
    background: #333;
    color: #fff;
    border-radius: 5px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
  }

  .year-text {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    padding-left: 20px;
  }

  .color-bar {
    width: 15px;
    height: 100%;
    border-radius: 3px;
  }

  .red { background: #e53935; }
  .orange { background: #fb8c00; }
  .yellow { background: #fdd835; }
  .green { background: #43a047; }
  .blue { background: #1e88e5; }
  .pink { background: #d81b60; }

  /* خطوط اتصال دایره به بلوک سیاه */
  .connector {
    position: absolute;
    width: 2px;
    background: currentColor;
    z-index: 1;
    height: 0;
    animation: growLine 1s forwards;
  }

  @keyframes growLine {
    from { height: 0; }
    to { height: var(--line-height); }
  }

  /* واکنش‌گرایی موبایل */
  @media (max-width: 768px) {
    .timeline-container {
      flex-direction: row;
      gap: 10px;
      padding: 10px;
    }
    .circles {
      flex: 0 0 25%;
      gap: 20px;
    }
    .circle {
      width: 40px;
      height: 40px;
      font-size: 12px;
    }
    .black-box {
      flex: 1;
      padding: 15px;
    }
  }
</style>
</head>
<body>

<div class="header">TIMELINE TEMPLATE</div>

<div class="timeline-container">
  <div class="circles">
    <div class="circle y1998" data-color="#e53935"></div>
    <div class="circle y2005" data-color="#fb8c00"></div>
    <div class="circle y2008" data-color="#fdd835"></div>
    <div class="circle y2010" data-color="#43a047"></div>
    <div class="circle y2013" data-color="#1e88e5"></div>
    <div class="circle y2017" data-color="#d81b60"></div>
  </div>

  <div class="black-box">
    <div class="year-text" data-color="#e53935"><div class="color-bar red"></div><p>متن توضیحات مربوط به سال 1998</p></div>
    <div class="year-text" data-color="#fb8c00"><div class="color-bar orange"></div><p>متن توضیحات مربوط به سال 2005</p></div>
    <div class="year-text" data-color="#fdd835"><div class="color-bar yellow"></div><p>متن توضیحات مربوط به سال 2008</p></div>
    <div class="year-text" data-color="#43a047"><div class="color-bar green"></div><p>متن توضیحات مربوط به سال 2010</p></div>
    <div class="year-text" data-color="#1e88e5"><div class="color-bar blue"></div><p>متن توضیحات مربوط به سال 2013</p></div>
    <div class="year-text" data-color="#d81b60"><div class="color-bar pink"></div><p>متن توضیحات مربوط به سال 2017</p></div>
  </div>
</div>

<script>
const circles = document.querySelectorAll('.circles .circle');
const years = document.querySelectorAll('.black-box .year-text');
const container = document.querySelector('.timeline-container');

circles.forEach((circle, i) => {
  const year = years[i];
  const connector = document.createElement('div');
  connector.classList.add('connector');
  connector.style.backgroundColor = circle.dataset.color;

  container.appendChild(connector);

  // موقعیت خطوط
  const topCircle = circle.offsetTop + circle.offsetHeight/2;
  const topYear = year.offsetTop + year.offsetHeight/2;
  connector.style.left = (circle.offsetLeft + circle.offsetWidth) + 'px';
  connector.style.top = topCircle + 'px';
  const lineHeight = topYear - topCircle;
  connector.style.setProperty('--line-height', lineHeight + 'px');
});
</script>

</body>
</html>
